# verl agent_loop registry overrides for ThinkStream.
#
# Points the registry key `thinkstream_streaming_agent` (set by our
# CustomRLHFDataset on every row) at the streaming chunk-level loop in
# verl/recipe_thinkstream/streaming_agent_loop.py.
#
# Why the dir is named recipe_thinkstream/ and NOT thinkstream/:
#   With launcher PYTHONPATH=${VERL_DIR}:${PROJECT_DIR}, having a dir
#   named "thinkstream" inside verl/ would shadow the real ThinkStream
#   Python package (ThinkStream/thinkstream/), breaking
#   `from thinkstream.trainer.v12_rewards import ...` lookups in both
#   the reward fn and the agent loop. The rename eliminates the collision.
#
# Loaded via rollout.agent.agent_loop_config_path in thinkstream_grpo.yaml.
- name: thinkstream_streaming_agent
  _target_: recipe_thinkstream.streaming_agent_loop.make_thinkstream_streaming_agent_loop
